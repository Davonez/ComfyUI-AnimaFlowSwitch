[project]
name = "comfyui-anima-flow-switch"
version = "2.0.0"
description = "Two lazy-execution branch switches for ComfyUI: an Anima flow switch that flips model, positive and negative with one dropdown, and a ControlNet switch. When skipped, the upstream branch is never executed at all."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "koivis" }]
keywords = ["comfyui", "custom-nodes", "switch", "anima", "controlnet", "lazy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Davonez/ComfyUI-AnimaFlowSwitch"
Repository = "https://github.com/Davonez/ComfyUI-AnimaFlowSwitch"
"Issue Tracker" = "https://github.com/Davonez/ComfyUI-AnimaFlowSwitch/issues"

# ComfyUI Registry 的展示信息（按需补 PublisherId 后即可 comfy node publish）
[tool.comfy]
DisplayName = "Anima Flow Switch"
